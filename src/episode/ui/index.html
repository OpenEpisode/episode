<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Episode</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=17">

</head>
<body>
<aside id="sidebar">
  <div class="sidebar-brand">
    <img src="logo.svg" class="logo" alt="">
    <h1>Episode</h1>
    <span id="app-version" class="app-version" aria-label="Episode version"></span>
  </div>
  <nav>
    <a href="#episodes" class="active">Episodes</a>
    <a href="#activity">Activity</a>
    <a href="#evidence">Evidence</a>
    <a href="#devices">Devices</a>
    <a href="#system">System</a>
  </nav>
  <button id="theme-toggle" onclick="toggleTheme()"></button>
  <div id="sidebar-status"></div>
  <div id="recent-episodes-sidebar"></div>
</aside>
<div id="sidebar-overlay" onclick="toggleSidebar()" class="hidden"></div>
<main id="content">
  <div id="mobile-header">
    <button id="sidebar-toggle" onclick="toggleSidebar()" aria-label="Open navigation">&#9776;</button>
    <span id="mobile-title">Episode</span>
  </div>
  <div id="view-loading">Loading...</div>
  <div id="view-error" class="hidden"></div>
  <div id="view-content"></div>
</main>

<div id="evidence-carousel" class="carousel-overlay hidden">
  <div class="carousel-backdrop" onclick="closeCarousel()"></div>
  <button class="carousel-close" onclick="closeCarousel()">&times;</button>
  <button class="carousel-prev" onclick="carouselNav(-1)">&#8249;</button>
  <button class="carousel-next" onclick="carouselNav(1)">&#8250;</button>
  <div class="carousel-viewport">
    <div id="carousel-slide"></div>
    <div id="carousel-counter" class="carousel-counter">0 / 0</div>
  </div>
  <div id="carousel-info" class="carousel-info"></div>
</div>

<script type="module" src="app.js?v=21"></script>
</body>
</html>
