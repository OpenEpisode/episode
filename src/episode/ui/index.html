<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Episode</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=6">
<style>
@media (max-width: 1024px) {
  body { display: block; min-height: 100dvh; overflow-y: auto; }
  main { overflow-y: visible; height: auto; padding: 1rem; padding-top: 0; }
  #mobile-header { display: flex; align-items: center; padding: 0.5rem 0.75rem; background: var(--surface); border-bottom: 1px solid var(--border); margin-bottom: 0.75rem; }
  #sidebar-toggle { background: none; border: none; color: var(--text-primary); font-size: 1.3rem; padding: 0.25rem; cursor: pointer; line-height: 1; }
  #mobile-title { font-weight: 600; font-size: 0.95rem; flex: 1; text-align: center; color: var(--text-muted); margin-right: 1.8rem; }
  aside { position: fixed !important; top: 0; left: 0; bottom: 0; z-index: 1000; transform: translateX(-100%); transition: transform 0.2s ease; width: 260px; border-right: 1px solid var(--border); box-shadow: var(--shadow); }
  aside.open { transform: translateX(0); }
  #sidebar-overlay { display: block; }
  #sidebar-overlay.hidden { display: none; }
  .card-grid { grid-template-columns: 1fr; }
  .evidence-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  table { font-size: 0.8rem; }
  th, td { padding: 0.4rem 0.5rem; }
  .page-header h2 { font-size: 1.1rem; }
}
</style>
</head>
<body>
<aside id="sidebar">
  <div class="sidebar-brand">
    <img src="logo.svg" class="logo" alt="">
    <h1>Episode</h1>
  </div>
  <nav>
    <a href="#episodes" class="active">Episodes</a>
    <a href="#activity">Activity</a>
    <a href="#evidence">Evidence</a>
    <a href="#devices">Devices</a>
    <a href="#system">System</a>
  </nav>
  <button id="theme-toggle" onclick="toggleTheme()"></button>
  <div id="sidebar-status"></div>
  <div id="recent-episodes-sidebar"></div>
</aside>
<div id="sidebar-overlay" onclick="toggleSidebar()" class="hidden"></div>
<main id="content">
  <div id="mobile-header">
    <button id="sidebar-toggle" onclick="toggleSidebar()" aria-label="Open navigation">&#9776;</button>
    <span id="mobile-title">Episode</span>
  </div>
  <div id="view-loading">Loading...</div>
  <div id="view-error" class="hidden"></div>
  <div id="view-content"></div>
</main>

<div id="evidence-carousel" class="carousel-overlay hidden">
  <div class="carousel-backdrop" onclick="closeCarousel()"></div>
  <button class="carousel-close" onclick="closeCarousel()">&times;</button>
  <button class="carousel-prev" onclick="carouselNav(-1)">&#8249;</button>
  <button class="carousel-next" onclick="carouselNav(1)">&#8250;</button>
  <div class="carousel-viewport">
    <div id="carousel-slide"></div>
    <div id="carousel-counter" class="carousel-counter">0 / 0</div>
  </div>
  <div id="carousel-info" class="carousel-info"></div>
</div>

<script src="app.js?v=5"></script>
</body>
</html>
