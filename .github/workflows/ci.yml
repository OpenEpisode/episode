name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build
      - run: node --check src/episode/ui/app.js
      - run: docker compose --env-file .env.example config -q
      - run: docker compose --env-file .env.example -f compose.yaml -f compose.dev.yaml config -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          push: false
          tags: episode:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          cat > "${RUNNER_TEMP}/episode-ci.json" <<'EOF'
          {
            "data_dir": "/var/episode/data",
            "api_host": "0.0.0.0",
            "api_port": 8989,
            "connectors": [],
            "areas": [],
            "devices": []
          }
          EOF
          docker run --detach --name episode-ci \
            --publish 127.0.0.1:8989:8989 \
            --volume "${RUNNER_TEMP}/episode-ci.json:/app/config.json:ro" episode:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8989/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs episode-ci
          exit 1
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force episode-ci || true
